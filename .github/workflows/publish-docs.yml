name: Release GhPages
on:
  workflow_dispatch:
  workflow_call:

jobs:
  release_demo:
    name: Release Demo
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    strategy:
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup NodeJS
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.0
      - name: Update npm
        run: npm install -g npm@10.9.7
      - name: Install Dependencies
        run: |
          npm ci
      - name: Build Demo
        run: |
          npm run build
          npm run build:demo
      - name: Create root redirect
        if: github.ref == 'refs/heads/master'
        run: |
          mkdir -p dist
          echo '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0; url=/novo-elements/docs/"></head></html>' > dist/index.html
      - name: Deploy to GitHub Pages (docs)
        if: github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          destination_dir: docs
      - name: Deploy root redirect
        if: github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          keep_files: true