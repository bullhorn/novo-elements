name: Release Novo Elements
on:
  workflow_dispatch:
    inputs:
      dry-run:
        type: boolean
        description: Dry Run

jobs:
  build_and_release:
    name: Build & Publish
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
    steps:
      # Release commit is pushed straight to master, so the token must belong to a repo admin
      # to bypass branch protection (required reviews and status checks)
      - name: Verify Release Token
        env:
          GH_TOKEN: ${{ secrets.API_TOKEN_GITHUB }}
        run: |
          login=$(gh api user --jq .login || echo unknown)
          admin=$(gh api repos/${{ github.repository }} --jq .permissions.admin)
          echo "Release token user: $login (admin: $admin)"
          if [ "${{ github.ref_name }}" = "master" ] && [ "$admin" != "true" ]; then
            echo "::error::API_TOKEN_GITHUB must have admin access to push the release commit to master"
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.API_TOKEN_GITHUB }}
      - name: Setup NodeJS
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.0
      - name: Update npm
        run: npm install -g npm@10.9.7
      - name: Install Dependencies
        run: |
          npm ci
      - name: Building Projects
        run: |
          npm run build:ci
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.API_TOKEN_GITHUB }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npx semantic-release --dry-run ${{ github.event.inputs.dry-run }}