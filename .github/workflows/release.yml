name: Release Novo Elements
on:
  workflow_dispatch:
    inputs:
      dry-run:
        type: boolean
        description: Dry Run

jobs:
  build_and_release:
    name: Build & Publish
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.API_TOKEN_GITHUB }}
      - name: Setup NodeJS
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.0
      - name: Update npm
        run: npm install -g npm@10.9.7
      - name: Install Dependencies
        run: |
          npm ci
      - name: Building Projects
        run: |
          npm run build:ci
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.API_TOKEN_GITHUB }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npx semantic-release --dry-run ${{ github.event.inputs.dry-run }}
      # Only fast-forwards; if next has commits master doesn't, merge master into next manually
      - name: Fast-forward next to master
        if: github.ref_name == 'master' && !inputs.dry-run
        run: |
          git fetch origin next
          if git merge-base --is-ancestor origin/next HEAD; then
            git push origin HEAD:next
          else
            echo "::warning::next has diverged from master; merge master into next manually"
          fi
